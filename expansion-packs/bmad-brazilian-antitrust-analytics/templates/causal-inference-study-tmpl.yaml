# Instruções de Uso

## Como Utilizar Este Template

1. **Preencha os campos entre colchetes** `[ ]` com informações específicas
2. **Use R como linguagem preferencial** para implementação de inferência causal
3. **Mantenha comentários em inglês** no código fonte
4. **Forneça relatórios em português brasileiro**
5. **Inclua validação robusta de suposições** causais
6. **Considere o contexto institucional brasileiro** na análise

## Padrões Técnicos

- **Linguagem:** Português para relatórios, inglês para código
- **Software:** R preferencialmente para métodos econométricos tradicionais
- **Validação:** Múltiplos métodos e testes de robustez
- **Transparência:** Código reprodutível e documentação completa
- **Contexto:** Análise sensível ao contexto brasileiro específico