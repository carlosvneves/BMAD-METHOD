# <!-- Powered by BMAD™ Core -->
template:
  name: Automated Data Science Report Template
  version: 1.0.0
  description: Comprehensive template for automated data science reports with real-time insights, validation, and review features
  icon: 📊
  fields:
    # Report Metadata
    reportTitle:
      type: string
      required: true
      description: Title of the automated report
    reportType:
      type: select
      options: [daily-summary, weekly-analysis, monthly-insights, real-time-dashboard, anomaly-alert]
      required: true
      description: Type of automated report
    generatedAt:
      type: datetime
      autoGenerated: true
      description: Automatic timestamp generation
    
    # Data Sources & Configuration
    dataSources:
      type: array
      required: true
      description: List of data sources with connection details
      fields:
        - name: sourceName
          type: string
        - type: database | api | file | stream
        - connectionDetails: object
        - refreshFrequency: cron-expression
        - lastRefresh: datetime
          autoGenerated: true
    
    # Automated Analysis Configuration
    analysisModules:
      type: array
      required: true
      description: Automated analysis modules to execute
      fields:
        - name: moduleName
          type: string
        - type: statistical | ml-prediction | anomaly-detection | trend-analysis
        - enabled: boolean
        - schedule: cron-expression
        - dependencies: array
          of: string
    
    # Automated Validation & QA
    qualityChecks:
      type: object
      required: true
      description: Automated quality validation settings
      fields:
        - dataQuality:
            enabled: boolean
            thresholds: object
            alertOnFailure: boolean
        - statisticalValidation:
            enabled: boolean
            confidenceLevel: number
            significanceTests: array
        - methodologyReview:
            enabled: boolean
            complianceStandards: array
        - automatedReview:
            enabled: boolean
            reviewDepth: basic | comprehensive
            autoApproval: boolean
    
    # Report Generation Settings
    generationConfig:
      type: object
      required: true
      description: Automated report generation configuration
      fields:
        - template: string
        - outputFormats: array
          of: pdf | html | json | email | dashboard
        - distribution:
            channels: array
            of: email | webhook | slack | teams | api
            recipients: array
            of: string
        - scheduling:
            frequency: cron-expression
            timezone: string
            businessCalendar: boolean
        - retention:
            keepHistory: number
            archiveLocation: string
    
    # Dashboard & Visualization
    dashboardConfig:
      type: object
      description: Real-time dashboard configuration
      fields:
        - enabled: boolean
        - refreshInterval: number
        - interactive: boolean
        - roleBasedAccess: boolean
        - widgets: array
          of: object
    
    # Alert & Notification Settings
    alertConfig:
      type: object
      description: Automated alerting configuration
      fields:
        - enabled: boolean
        - rules: array
          of: object
        - escalation:
            levels: array
            of: object
        - channels: array
          of: email | sms | slack | teams | webhook
        - suppression:
            enabled: boolean
            schedule: cron-expression
    
    # AI-Enhanced Features
    aiFeatures:
      type: object
      description: AI-powered automation features
      fields:
        - naturalLanguageGeneration:
            enabled: boolean
            style: formal | conversational | executive
            complexity: basic | intermediate | advanced
        - predictiveInsights:
            enabled: boolean
            modelType: string
            confidenceThreshold: number
        - anomalyDetection:
            enabled: boolean
            algorithm: string
            sensitivity: number
        - automatedRecommendations:
            enabled: boolean
            impactAnalysis: boolean
    
    # Automated Review & Validation
    reviewAutomation:
      type: object
      description: Automated review and validation settings
      fields:
        - enabled: boolean
        - reviewers: array
          of: string
        - validationRules: array
          of: object
        - autoApproval:
            enabled: boolean
            conditions: array
            of: string
        - auditTrail:
            enabled: boolean
            detailed: boolean
    
    # Integration & API Settings
    integrationConfig:
      type: object
      description: System integration configuration
      fields:
        - apis: array
          of: object
        - webhooks: array
          of: object
        - authentication: object
        - rateLimiting: object
        - monitoring: object
    
    # Performance & Monitoring
    performanceConfig:
      type: object
      description: Performance monitoring configuration
      fields:
        - enabled: boolean
        - metrics: array
          of: string
        - thresholds: object
        - alerts: array
          of: object
        - logging:
            level: debug | info | warn | error
            retention: number
    
    # Security & Compliance
    securityConfig:
      type: object
      description: Security and compliance settings
      fields:
        - accessControl: object
        - dataEncryption: object
        - auditLogging: object
        - complianceStandards: array
          of: string
        - dataRetention: object
    
    # Automated Sections Generation
    sections:
      type: array
      required: true
      description: Automated report sections with generation rules
      fields:
        - name: string
          required: true
        - type: data-summary | statistical-analysis | insights | recommendations | visualizations | quality-metrics
        - generationRule: string
        - schedule: cron-expression
        - dependencies: array
          of: string
        - validationRules: array
          of: object
    
    # Success Metrics & KPIs
    successMetrics:
      type: object
      description: Automated success metrics tracking
      fields:
        - reportGenerationTime: object
        - dataQualityScore: object
        - userEngagement: object
        - businessImpact: object
        - costSavings: object

content:
  # Automated Report Structure
  sections:
    - title: Executive Summary (AI-Generated)
      type: automated
      generator: natural-language-generation
      config:
        style: executive
        length: concise
        focus: key-insights
    
    - title: Automated Data Quality Report
      type: automated
      generator: data-quality-assessment
      config:
        includeTrends: true
        thresholdAlerts: true
        visualization: scorecard
    
    - title: Real-Time Analytics Dashboard
      type: interactive
      generator: real-time-dashboard
      config:
        refreshInterval: 300
        interactiveFilters: true
        exportOptions: true
    
    - title: Statistical Analysis & Validation
      type: automated
      generator: statistical-analysis
      config:
        confidenceLevel: 0.95
        significanceTests: true
        methodologyReview: true
    
    - title: AI-Generated Insights & Recommendations
      type: automated
      generator: ai-insights-engine
      config:
        predictiveInsights: true
        actionItems: true
        impactAnalysis: true
    
    - title: Automated Quality Assurance Report
      type: automated
      generator: quality-validation
      config:
        comprehensiveCheck: true
        autoApproval: true
        auditTrail: true
    
    - title: Performance Monitoring & Alerts
      type: automated
      generator: performance-monitoring
      config:
        realTimeMetrics: true
        thresholdAlerts: true
        historicalTrends: true
    
    - title: Compliance & Governance Report
      type: automated
      generator: compliance-checker
      config:
        standards: ["GDPR", "SOC2", "ISO27001"]
        autoValidation: true
        reportingFrequency: monthly
    
    - title: Automated Review & Validation Summary
      type: automated
      generator: automated-review
      config:
        reviewDepth: comprehensive
        autoApprovalConditions: ["quality_score > 0.95", "validation_passed = true"]
        stakeholderNotification: true
    
    - title: Next Steps & Action Items
      type: automated
      generator: action-item-generator
      config:
        priority: high
        assignees: automated
        timeline: auto-calculated
        tracking: integrated

  # Automated Generation Rules
  generationRules:
    - rule: "Generate when new data arrives"
      condition: "data_sources.freshness < 5min"
      action: "execute_full_report"
    - rule: "Generate on schedule"
      condition: "cron_schedule.matches()"
      action: "execute_scheduled_report"
    - rule: "Generate on anomaly detection"
      condition: "anomaly_detector.alert_triggered"
      action: "execute_alert_report"
    - rule: "Auto-approve high-quality reports"
      condition: "quality_score > 0.95 AND validation_passed = true"
      action: "auto_approve_and_distribute"
    - rule: "Flag for manual review"
      condition: "quality_score < 0.8 OR validation_failed = true"
      action: "flag_for_manual_review"

  # Automated Distribution Rules
  distributionRules:
    - condition: "report_type = 'daily-summary'"
      channels: ["email", "slack"]
      recipients: ["executive_team@company.com", "#daily-reports"]
    - condition: "report_type = 'anomaly-alert'"
      channels: ["sms", "email", "slack"]
      recipients: ["on-call_team@company.com", "#alerts"]
      escalation: true
    - condition: "quality_score < 0.8"
      channels: ["email"]
      recipients: ["quality_team@company.com"]
      priority: high