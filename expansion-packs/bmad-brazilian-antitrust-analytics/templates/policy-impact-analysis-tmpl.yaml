# Instruções de Uso

## Como Utilizar Este Template

1. **Preencha os campos entre colchetes** `[ ]` com informações específicas
2. **Use R como linguagem preferencial** para implementação de análise de impacto
3. **Mantenha comentários em inglês** no código fonte
4. **Forneça relatórios em português brasileiro**
5. **Inclua análise custo-benefício completa** com múltiplos cenários
6. **Considere o contexto institucional brasileiro** na análise

## Padrões Técnicos

- **Linguagem:** Português para relatórios, inglês para código
- **Software:** R preferencialmente para métodos econométricos
- **Validação:** Múltiplos métodos e análise de sensibilidade
- **Documentação:** Código reprodutível e documentação completa
- **Contexto:** Análise adaptada ao contexto brasileiro específico