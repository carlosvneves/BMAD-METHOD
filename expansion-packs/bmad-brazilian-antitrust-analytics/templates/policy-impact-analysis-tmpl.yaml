  version: "1.0"
  author: "Econometrician Agent - Brazilian Antitrust Analytics"
  description: "Template para análise abrangente de impacto de políticas com foco brasileiro"
  language: "pt-BR"
  created_date: "2024-01-01"
  last_updated: "2024-01-01"

