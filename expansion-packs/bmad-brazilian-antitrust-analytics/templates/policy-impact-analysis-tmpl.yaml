# Implementação em R (Preferencial)
r_implementation:
  required_packages:
    - "tidyverse"
    - "lubridate"
    - "AER"
    - "did"
    - "fixest"
    - "synth"
    - "rdrobust"
    - "MatchIt"
    - "sandwich"
    - "lmtest"
    "ivreg"

  data_preparation_code: |
    # Policy impact analysis - Brazilian context
    library(tidyverse)
    library(lubridate)

    # Load policy evaluation data
    policy_data <- read_csv("data/brazilian_policy_evaluation.csv") %>%
      mutate(
        date = ymd(date),
        year = year(date),
        month = month(date),
        quarter = quarter(date),

        # Create treatment indicators
        policy_date = as.Date("[Data de Implementação da Política]"),
        post_policy = date >= policy_date,
        treatment = if_else(unit_id %in% treated_units, 1, 0),
        treated_post = treatment * post_policy,

        # Brazilian-specific controls
        region = factor(region),
        state = factor(state),
        municipality = factor(municipality),

        # Macroeconomic controls
        gdp_growth = get_brazilian_gdp_growth(date),
        inflation_rate = get_brazilian_inflation(date),
        selic_rate = get_brazilian_selic_rate(date),
        exchange_rate = get_brazilian_exchange_rate(date),

        # Time relative to policy
        months_to_policy = as.numeric(date - policy_date) / 30,
        years_to_policy = months_to_policy / 12
      ) %>%
      filter(!is.na(main_outcome))

  impact_estimation_code: |
    # Main impact estimation - Difference-in-Differences
    library(fixest)
    library(did)

    # Primary DiD model with cluster-robust standard errors
    main_did_model <- feols(
      main_outcome ~ treated_post + gdp_growth + inflation_rate + exchange_rate |
      unit_id + year + quarter,
      data = policy_data,
      vcov = ~unit_id
    )

    # Event study for dynamic effects
    event_study_model <- feols(
      main_outcome ~ treated_post + months_to_policy + I(months_to_policy^2) +
        gdp_growth + inflation_rate + exchange_rate |
      unit_id + year + quarter,
      data = policy_data,
      vcov = ~unit_id
    )

    # Using the did package for advanced DiD
    did_results <- att_gt(
      yname = "main_outcome",
      gname = "treatment",
      tname = "date",
      data = policy_data,
      control_group = "notyettreated",
      bstrap = TRUE,
      cband = TRUE
    )

    # Aggregate event study results
    event_study <- aggte(did_results, type = "dynamic")

  heterogeneity_analysis_code: |
    # Heterogeneity analysis by region
    regional_effects <- policy_data %>%
      group_by(region) %>%
      group_modify(~ {
        feols(main_outcome ~ treated_post + controls | unit_id + year,
              data = .x,
              vcov = ~unit_id)
      })

    # Heterogeneity by sector
    sectoral_effects <- policy_data %>%
      group_by(sector) %>%
      group_modify(~ {
        feols(main_outcome ~ treated_post + controls | unit_id + year,
              data = .x,
              vcov = ~unit_id)
      })

    # Heterogeneity by firm size
    size_effects <- policy_data %>%
      mutate(size_category = case_when(
        employment < 10 ~ "micro",
        employment < 50 ~ "small",
        employment < 250 ~ "medium",
        TRUE ~ "large"
      )) %>%
      group_by(size_category) %>%
      group_modify(~ {
        feols(main_outcome ~ treated_post + controls | unit_id + year,
              data = .x,
              vcov = ~unit_id)
      })

  cost_benefit_code: |
    # Cost-benefit analysis implementation
    calculate_npv <- function(cash_flows, discount_rate) {
      npv <- 0
      for (i in seq_along(cash_flows)) {
        npv <- npv + cash_flows[i] / (1 + discount_rate)^i
      }
      return(npv)
    }

    calculate_bcr <- function(benefits, costs, discount_rate) {
      npv_benefits <- calculate_npv(benefits, discount_rate)
      npv_costs <- calculate_npv(costs, discount_rate)
      return(npv_benefits / npv_costs)
    }

    # Brazilian-specific discount rate
    brazilian_discount_rate <- 0.05  # 5% typical for Brazilian public projects

    # Project cash flows
    years <- 0:10  # 10-year projection
    annual_benefits <- c(0, rep(baseline_annual_benefit, length(years) - 1))
    annual_costs <- c(initial_investment, rep(annual_operating_cost, length(years) - 1))

    # Calculate metrics
    npv <- calculate_npv(annual_benefits - annual_costs, brazilian_discount_rate)
    bcr <- calculate_bcr(annual_benefits, annual_costs, brazilian_discount_rate)

    # Sensitivity analysis
    discount_rates <- c(0.03, 0.05, 0.07, 0.10)
    sensitivity_results <- data.frame(
      discount_rate = discount_rates,
      npv = sapply(discount_rates, function(dr) {
        calculate_npv(annual_benefits - annual_costs, dr)
      }),
      bcr = sapply(discount_rates, function(dr) {
        calculate_bcr(annual_benefits, annual_costs, dr)
      })
    )

  visualization_code: |
    # Create impact visualizations
    library(ggplot2)
    library(plotly)

    # Main impact visualization
    impact_plot <- ggplot(policy_data, aes(x = date, y = main_outcome, color = treatment)) +
      geom_line(size = 1) +
      geom_vline(xintercept = as.Date("[Data de Implementação da Política]"),
                linetype = "dashed", color = "red") +
      labs(title = "Impacto da Política - Evolução Temporal",
           x = "Data", y = "[Variável de Outcome]",
           color = "Grupo",
           subtitle = "Linha vermelha indica implementação da política") +
      theme_minimal()

    # Event study visualization
    event_study_plot <- ggplot(event_study_data, aes(x = time_to_event, y = estimate)) +
      geom_point(size = 3) +
      geom_errorbar(aes(ymin = lower_ci, ymax = upper_ci), width = 0.3) +
      geom_hline(yintercept = 0, linetype = "dashed", color = "red") +
      labs(title = "Análise de Eventos - Efeitos Dinâmicos",
           x = "Meses Relativos à Política",
           y = "Efeito Estimado") +
      theme_minimal()

    # Cost-benefit visualization
    cb_plot <- ggplot(sensitivity_results, aes(x = discount_rate, y = npv)) +
      geom_line(size = 2, color = "blue") +
      geom_point(size = 3) +
      geom_hline(yintercept = 0, linetype = "dashed", color = "red") +
      labs(title = "Análise de Sensibilidade - VPL por Taxa de Desconto",
           x = "Taxa de Desconto",
           y = "Valor Presente Líquido (R$ milhões)") +
      theme_minimal()

  robustness_checks_code: |
    # Robustness checks
    # Alternative specifications
    robustness_models <- list(
      baseline = main_did_model,
      log_linear = feols(log(main_outcome) ~ treated_post + controls | unit_id + year,
                        data = policy_data),
      state_trends = feols(main_outcome ~ treated_post + controls | unit_id + year + unit:year,
                           data = policy_data),
      with_macro_controls = feols(main_outcome ~ treated_post + gdp_growth + inflation_rate +
                                  exchange_rate + unemployment_rate | unit_id + year,
                                  data = policy_data)
    )

    # Placebo tests
    placebo_dates <- seq(min(policy_data$date), max(policy_data$date), by = "6 months")
    placebo_results <- list()

    for (placebo_date in placebo_dates) {
      placebo_data <- policy_data
      placebo_data$placebo_treatment <- if_else(
        placebo_data$date >= placebo_date & placebo_data$treatment == 1,
        1, 0
      )

      placebo_model <- feols(
        main_outcome ~ placebo_treatment + controls | unit_id + year,
        data = placebo_data,
        vcov = ~unit_id
      )

      placebo_results[[as.character(placebo_date)]] <- placebo_model
    }

    # Sample splitting validation
    sample_splits <- list(
      first_half = policy_data %>% filter(year <= median_year),
      second_half = policy_data %>% filter(year > median_year),
      pre_crisis = policy_data %>% filter(year < 2008),
      post_crisis = policy_data %>% filter(year >= 2008)
    )

    split_results <- lapply(sample_splits, function(sample_data) {
      feols(main_outcome ~ treated_post + controls | unit_id + year,
            data = sample_data,
            vcov = ~unit_id)
    })

