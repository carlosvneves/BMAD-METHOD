# Implementação em R (Preferencial)
r_implementation:
  required_packages:
    - "tidyverse"
    - "AER"
    - "plm"
    - "fixest"
    - "sandwich"
    - "lmtest"
    - "urca"
    - "vars"
    - "forecast"

  data_loading_code: |
    # Load Brazilian data
    library(tidyverse)
    library(lubridate)

    # Load main dataset
    data <- read_csv("path/to/brazilian_data.csv") %>%
      mutate(
        date = ymd(date),
        # Brazilian-specific date handling
        year = year(date),
        month = month(date),
        quarter = quarter(date),
        region = factor(region),
        # Add Brazilian calendar effects
        is_carnival = is_carnival_period(date),
        is_election_year = is_election_year(date)
      ) %>%
      filter(!is.na(main_outcome_variable))

  model_estimation_code: |
    # Model estimation using R (preferred for econometrics)
    library(fixest)

    # Fixed effects model with cluster-robust standard errors
    main_model <- feols(
      outcome_variable ~ treatment_variable + control_variable1 + control_variable2 |
      unit_id + year + quarter,
      data = data,
      vcov = ~unit_id  # Cluster by unit
    )

    # For IV models
    iv_model <- feols(
      outcome_variable ~ 1 | control_variable1 + control_variable2 |
      unit_id + year,
      data = data,
      vcov = ~unit_id
    )

    # For time series analysis
    library(vars)
    library(urca)

    # Stationarity testing - multiple test approach
    adf_test <- ur.df(data$variable, type = "drift", lags = 12)
    kpss_test <- ur.kpss(data$variable, type = "mu")

    # VAR model for understanding relationships
    var_data <- data %>%
      select(variable1, variable2, variable3) %>%
      na.omit()

    var_model <- VAR(var_data, p = 2, type = "const")

  diagnostic_code: |
    # Diagnostic testing
    library(lmtest)
    library(sandwich)

    # Extract residuals
    residuals <- residuals(main_model)

    # Breusch-Pagan test for heteroskedasticity
    bp_test <- bptest(main_model)

    # Durbin-Watson test for autocorrelation
    dw_test <- dwtest(main_model)

    # Normality test
    jarque_bera_test <- jarque.bera.test(residuals)

    # VIF for multicollinearity
    library(car)
    vif_values <- vif(main_model)

  robustness_code: |
    # Robustness checks
    # Alternative specifications
    robustness_models <- list(
      log_linear = feols(log(outcome_variable) ~ treatment_variable + controls | unit + year, data = data),
      with_interactions = feols(outcome_variable ~ treatment_variable*region + controls | unit + year, data = data),
      state_trends = feols(outcome_variable ~ treatment_variable + controls | unit + year + unit:year, data = data)
    )

    # Subsample analysis
    subsample_results <- list()
    regions <- unique(data$region)
    for (region in regions) {
      region_data <- data[data$region == region, ]
      subsample_models[[region]] <- feols(
        outcome_variable ~ treatment_variable + controls | unit + year,
        data = region_data,
        vcov = ~unit_id
      )
    }

# Análise de Não Linearidade (Avançado)
nonlinear_analysis:
  test_for_nonlinearity: true
  nonlinearity_tests:
    - test_type: "Terasvirta Neural Network Test"
      r_package: "tseries"
      significance_level: 0.05
    - test_type: "White Neural Network Test"
      r_package: "tseries"
      significance_level: 0.05
    - test_type: "Keenan Test"
      r_package: "tseries"
      significance_level: 0.05
    - test_type: "McLeod-Li Test"
      r_package: "tseries"
      significance_level: 0.05

  causal_inference_advanced:
    transfer_entropy: true
    convergence_cross_mapping: true
    r_packages:
      - "RTransferEntropy"
      - "rEDM"
      - "nonlinearTseries"

# Análise de Heterogeneidade
heterogeneity_analysis:
  dimensions:
    - dimension: "Regional"
      groups: ["Norte", "Nordeste", "Sudeste", "Sul", "Centro-Oeste"]
      interaction_term: "treatment_variable * region"

    - dimension: "Setorial"
      groups: ["Setor 1", "Setor 2", "Setor 3"]
      interaction_term: "treatment_variable * sector"

    - dimension: "Tamanho"
      groups: ["Pequenas", "Médias", "Grandes"]
      interaction_term: "treatment_variable * size_category"

    - dimension: "Tempo"
      groups: ["Curto Prazo", "Médio Prazo", "Longo Prazo"]
      analysis_method: "event_study"

