    expected_result: "[Resultado Esperado]"

  heteroskedasticity_tests:
    test_type: "[Tipo de Teste - White, Breusch-Pagan, etc.]"
    significance_level: "[Nível de Significância]"
    correction_method: "[Método de Correção]"

  autocorrelation_tests:
    test_type: "[Tipo de Teste - Durbin-Watson, etc.]"
    significance_level: "[Nível de Significância]"
    correction_method: "[Método de Correção]"

  multicollinearity_tests:
    test_type: "[VIF, Condition Number, etc.]"
    threshold: "[Limite Aceitável]"
    correction_method: "[Método de Correção]"

  normality_tests:
    test_type: "[Shapiro-Wilk, Jarque-Bera, etc.]"
    significance_level: "[Nível de Significância]"

  robustness_checks:
