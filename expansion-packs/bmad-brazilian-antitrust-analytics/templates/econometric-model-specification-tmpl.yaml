# Instruções de Uso

## Como Utilizar Este Template

1. **Preencha os campos entre colchetes** `[ ]` com informações específicas do seu projeto
2. **Adapte as seções** conforme necessário para seu contexto específico
3. **Use R como linguagem preferencial** para implementação econométrica
4. **Mantenha comentários em inglês** no código fonte
5. **Forneça relatórios e análise em português brasileiro**
6. **Inclua testes abrangentes de não linearidade** quando aplicável
7. **Considere o contexto institucional brasileiro** na análise

## Padrões Recomendados

- **Linguagem:** Português brasileiro para relatórios, inglês para código
- **Software:** R preferencialmente, Python para ML e integrações complexas
- **Testes:** Múltiplos testes de estacionaridade e não linearidade
- **Validação:** Análise de robustez completa com múltiplas especificações
- **Contexto:** Sempre considerar o contexto brasileiro específico