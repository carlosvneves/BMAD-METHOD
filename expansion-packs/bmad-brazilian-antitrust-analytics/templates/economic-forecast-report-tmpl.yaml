# Implementação em R (Preferencial)
r_implementation:
  required_packages:
    - "forecast"
    - "vars"
    - "tseries"
    - "urca"
    - "xts"
    - "tidyverse"
    - "prophet"
    - "xgboost"
    - "randomForest"
    - "caret"

  data_preparation_code: |
    # Load and prepare Brazilian economic data
    library(tidyverse)
    library(lubridate)
    library(xts)

    # Load data from Brazilian sources
    brazilian_data <- read_csv("data/brazilian_economic_data.csv") %>%
      mutate(
        date = ymd(date),
        year = year(date),
        month = month(date),
        quarter = quarter(date),
        # Brazilian calendar effects
        is_carnival = is_carnival_period(date),
        is_election_year = is_election_year(date)
      ) %>%
      arrange(date)

    # Convert to time series object
    ts_data <- xts(brazilian_data[, -1], order.by = brazilian_data$date)

  time_series_analysis_code: |
    # Comprehensive time series analysis
    library(forecast)
    library(urca)
    library(tseries)

    # Stationarity tests - multiple approach
    adf_test <- ur.df(ts_data$variable, type = "drift", selectlags = "AIC")
    kpss_test <- ur.kpss(ts_data$variable, type = "mu")
    pp_test <- ur.pp(ts_data$variable)

    # Decomposition
    decomp <- stl(ts_data$variable, s.window = "periodic")
    plot(decomp)

    # Non-linearity testing
    library(tseries)
    terasvirta_test <- terasvirta.test(ts_data$variable)
    white_test <- white.test(ts_data$variable)

  model_estimation_code: |
    # ARIMA modeling
    arima_model <- auto.arima(ts_data$variable,
                             stepwise = FALSE,
                             approximation = FALSE,
                             seasonal = TRUE)

    # VAR modeling for multivariate forecasting
    library(vars)
    var_data <- ts_data[, c("variable1", "variable2", "variable3")]
    var_select <- VARselect(var_data, type = "const")
    var_model <- VAR(var_data, p = var_select$selection["SC(n)"])

    # Machine learning integration
    library(xgboost)
    library(caret)

    # Create features for ML
    create_features <- function(ts_data, lags = 12) {
      n <- nrow(ts_data)
      features <- data.frame(target = ts_data$variable)

      for (lag in 1:lags) {
        features[[paste0("lag_", lag)]] <- c(rep(NA, lag), ts_data$variable[1:(n-lag)])
      }

      # Calendar features
      features$month <- month(index(ts_data))
      features$quarter <- quarter(index(ts_data))
      features$year <- year(index(ts_data))

      return(features)
    }

    features_df <- create_features(ts_data)
    features_df <- features_df[complete.cases(features_df), ]

    # Train XGBoost model
    xgb_model <- xgboost(
      data = as.matrix(features_df[, -1]),
      label = features_df$target,
      nrounds = 100,
      objective = "reg:squarederror"
    )

  forecast_combination_code: |
    # Forecast combination
    forecast_horizon <- 12

    # Generate individual forecasts
    arima_forecast <- forecast(arima_model, h = forecast_horizon)
    var_forecast <- predict(var_model, n.ahead = forecast_horizon)

    # ML forecast
    xgb_forecast <- predict(xgb_model,
                           newdata = create_future_features(ts_data, forecast_horizon))

    # Combine forecasts using weighted average
    weights <- c(0.4, 0.3, 0.3)  # ARIMA, VAR, XGBoost
    combined_forecast <- weights[1] * arima_forecast$mean +
                       weights[2] * var_forecast$fcst[, 1] +
                       weights[3] * xgb_forecast

    # Calculate prediction intervals
    prediction_intervals <- calculate_prediction_intervals(
      forecasts = list(arima = arima_forecast,
                     var = var_forecast,
                     xgb = xgb_forecast),
      weights = weights,
      confidence_level = 0.95
    )

  visualization_code: |
    # Visualization of forecasts
    library(ggplot2)
    library(plotly)

    # Create forecast plot
    forecast_df <- data.frame(
      date = seq(max(index(ts_data)) + 1,
                 length.out = forecast_horizon,
                 by = "month"),
      forecast = combined_forecast,
      lower_ci = prediction_intervals$lower,
      upper_ci = prediction_intervals$upper
    )

    p <- ggplot() +
      geom_line(data = fortify(ts_data),
                aes(x = Index, y = variable),
                color = "blue", size = 1) +
      geom_line(data = forecast_df,
                aes(x = date, y = forecast),
                color = "red", size = 1, linetype = "dashed") +
      geom_ribbon(data = forecast_df,
                  aes(x = date, ymin = lower_ci, ymax = upper_ci),
                  alpha = 0.2, fill = "red") +
      labs(title = "Previsão Econômica - Brasil",
           x = "Data", y = "Valor",
           subtitle = "Combinação de Modelos com Intervalos de Confiança") +
      theme_minimal()

    # Convert to interactive plot
    interactive_plot <- ggplotly(p)

