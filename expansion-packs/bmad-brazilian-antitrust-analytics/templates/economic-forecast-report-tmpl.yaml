# Instruções de Uso

## Como Utilizar Este Template

1. **Preencha os campos entre colchetes** `[ ]` com informações específicas
2. **Use R como linguagem preferencial** para implementação de previsões
3. **Mantenha comentários em inglês** no código fonte
4. **Forneça relatórios em português brasileiro**
5. **Inclua múltiplos testes de estacionaridade** e não linearidade
6. **Considere contextos brasileiros específicos** na análise

## Padrões Técnicos

- **Linguagem:** Português para relatórios, inglês para código
- **Software:** R preferencialmente, Python para ML quando necessário
- **Validação:** Validação cruzada completa e análise de sensibilidade
- **Documentação:** Código bem documentado com exemplos reprodutíveis
- **Contexto:** Análise contextualizada para o ambiente econômico brasileiro